spring.application.name=nexthire-backend
server.port=8081

# Database Configuration
# Default active profile uses H2 in-memory DB for rapid development/testing, compatible with MySQL dialect
spring.datasource.url=jdbc:h2:mem:nexthiredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
nexthire.jwt.secret=9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1e3d5b7a9f2c4e6b8d0a2c4e6f8a1b3c5e
nexthire.jwt.expiration-ms=86400000
