# =============================================
# NextHire Production Configuration (Render.com + Railway MySQL)
# =============================================

# Server port (Render injects PORT env var)
server.port=${PORT:8080}

# Production MySQL Database (Railway)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# JWT Configuration
nexthire.jwt.secret=${JWT_SECRET}
nexthire.jwt.expiration-ms=86400000
